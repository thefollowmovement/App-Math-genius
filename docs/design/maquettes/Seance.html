<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance – exercice</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2EE6FF}a:hover{color:#FFFFFF}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120B2E; font-family: 'Nunito', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="position: absolute; top: 200px; left: 50%; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; background: #2EE6FF; opacity: 0.10; filter: blur(70px)"></div>

<div style="display: flex; align-items: center; gap: 12px; padding: 56px 20px 0; position: relative">
<button type="button" aria-label="Quitter la séance" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #3A2A78; background: #1E1450; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9B0E8" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div style="flex: 1; height: 16px; border-radius: 8px; background: #2A1B5E; border: 2px solid #3A2A78; overflow: hidden">
<div style="width: 40%; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #2EE6FF, #FF3EA5)"></div>
</div>
<span style="font-family: 'Bungee', sans-serif; font-size: 14px; color: #B9B0E8">6/15</span>
</div>

<div style="display: flex; justify-content: center; margin-top: 18px; position: relative">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #2A1040; border: 2px solid #FF7A2E; box-shadow: 0 0 18px rgba(255, 122, 46, 0.5)">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#FFC83D"></path></svg>
<span style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #FFC83D">COMBO x3</span>
</div>
</div>

<div style="margin: 22px 20px 0; padding: 22px 20px; border-radius: 24px; background: #1E1450; border: 2px solid #3A2A78; display: flex; flex-direction: column; gap: 16px; position: relative">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #2EE6FF">COMPARER DES FRACTIONS</span>
<div style="font-family: 'Bungee', sans-serif; font-size: 22px; line-height: 28px">Quelle fraction est la plus grande ?</div>
<div style="display: flex; gap: 8px; align-items: flex-end; height: 60px">
<div style="flex: 3; display: flex; gap: 3px; height: 26px"><div style="flex: 1; background: #FF3EA5; border-radius: 4px"></div><div style="flex: 1; background: #FF3EA5; border-radius: 4px"></div><div style="flex: 1; background: #FF3EA5; border-radius: 4px"></div><div style="flex: 1; background: #3A2A78; border-radius: 4px"></div></div>
<div style="flex: 3; display: flex; gap: 3px; height: 26px"><div style="flex: 1; background: #2EE6FF; border-radius: 4px"></div><div style="flex: 1; background: #2EE6FF; border-radius: 4px"></div><div style="flex: 1; background: #3A2A78; border-radius: 4px"></div></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 20px 20px 0; position: relative">
<button type="button" style="height: 88px; border-radius: 20px; border: 3px solid #FF3EA5; background: #2A1040; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 30px; box-shadow: 0 6px 0 #A61D68, 0 0 20px rgba(255, 62, 165, 0.45); cursor: pointer">3/4</button>
<button type="button" style="height: 88px; border-radius: 20px; border: 3px solid #3A2A78; background: #1E1450; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 30px; box-shadow: 0 6px 0 #0B0620; cursor: pointer">2/3</button>
<button type="button" style="height: 88px; border-radius: 20px; border: 3px solid #3A2A78; background: #1E1450; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 30px; box-shadow: 0 6px 0 #0B0620; cursor: pointer">5/8</button>
<button type="button" style="height: 88px; border-radius: 20px; border: 3px solid #3A2A78; background: #1E1450; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 30px; box-shadow: 0 6px 0 #0B0620; cursor: pointer">1/2</button>
</div>

<div style="flex: 1"></div>

<div style="display: flex; align-items: flex-end; gap: 10px; margin: 0 20px 14px; position: relative">
<img src="../personnages/poses/nova-encouragement.png" alt="Nova lève le pouce" style="height: 120px; width: auto; flex-shrink: 0">
<div style="padding: 12px 14px; border-radius: 16px 16px 16px 4px; background: #2A1B6E; border: 2px solid #4A3A98; font-size: 14px; font-weight: 800; line-height: 19px">Regarde les barres : laquelle va le plus loin ?</div>
</div>

<div style="padding: 0 20px 34px; position: relative">
<button type="button" style="width: 100%; height: 64px; border: none; border-radius: 18px; background: #3DFFA2; color: #0B2A1C; font-family: 'Bungee', sans-serif; font-size: 22px; letter-spacing: 1px; box-shadow: 0 7px 0 #1E9E62, 0 0 24px rgba(61, 255, 162, 0.45); cursor: pointer">VALIDER</button>
</div>
</div>


</body>
</html>
