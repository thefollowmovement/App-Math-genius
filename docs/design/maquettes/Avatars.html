<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choix de l'avatar</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2EE6FF}a:hover{color:#FFFFFF}
</style>

<div style="width: 860px; height: 1100px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 0%, #3A1A6E 0%, #120B2E 60%); font-family: 'Nunito', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 44px 40px 36px; gap: 24px; overflow: hidden">

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 3px; color: #2EE6FF">TA CREW NÉON</span>
<span style="font-family: 'Bungee', sans-serif; font-size: 36px; text-shadow: 0 0 16px #FF3EA5">Choisis ton héros</span>
<span style="font-size: 15px; font-weight: 700; color: #D6D0F5">Des stars de la scène qui chassent les monstres de calcul</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">

<button type="button" style="position: relative; padding: 10px 10px 14px; border-radius: 24px; background: linear-gradient(180deg, #3A1450 0%, #1E1450 100%); border: 3px solid #FF3EA5; box-shadow: 0 0 26px rgba(255, 62, 165, 0.55); display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<span style="position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 50%; background: #FF3EA5; display: flex; align-items: center; justify-content: center; z-index: 1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A0B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<img src="../personnages/nova.png" alt="Nova, cheveux argent-lilas, veste rose à paillettes" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">NOVA</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #FF8FCB">Étoile du rythme</span>
</button>

<button type="button" style="padding: 10px 10px 14px; border-radius: 24px; background: #1E1450; border: 3px solid #3A2A78; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<img src="../personnages/juno.png" alt="Juno, cheveux orange bouclés, bomber doré" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">JUNO</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #FFD66B">Reine des combos</span>
</button>

<button type="button" style="padding: 10px 10px 14px; border-radius: 24px; background: #1E1450; border: 3px solid #3A2A78; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<img src="../personnages/mika.png" alt="Mika, cheveux bleu nuit à mèches turquoise, veste holographique" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">MIKA</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #7FEFFF">Fée des étoiles</span>
</button>

<button type="button" style="padding: 10px 10px 14px; border-radius: 24px; background: #1E1450; border: 3px solid #3A2A78; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<img src="../personnages/kai.png" alt="Kai, cheveux bleus en pics, casque rose, veste cyan" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">KAI</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #7FEFFF">Maître du beat</span>
</button>

<button type="button" style="padding: 10px 10px 14px; border-radius: 24px; background: #1E1450; border: 3px solid #3A2A78; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<img src="../personnages/taro.png" alt="Taro, cheveux vert menthe, casquette violette, hoodie vert" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">TARO</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #7DFFC2">Roi des défis</span>
</button>

<button type="button" style="padding: 10px 10px 14px; border-radius: 24px; background: #1E1450; border: 3px solid #3A2A78; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; font-family: 'Nunito', sans-serif; cursor: pointer">
<img src="../personnages/leo.png" alt="Leo, cheveux blond platine, veste rouge et or, micro doré" style="width: 100%; height: 300px; object-fit: cover; object-position: 50% 15%; border-radius: 16px; display: block">
<span style="font-family: 'Bungee', sans-serif; font-size: 20px">LEO</span>
<span style="font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: #120B2E; color: #FF9A8A">Héros de la scène</span>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
<div style="padding: 14px; border-radius: 18px; background: #1E1450; border: 2px solid #3A2A78; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #B9B0E8">TENUE DE SCÈNE</span>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Tenue rose néon" style="width: 44px; height: 44px; border-radius: 12px; background: #FF3EA5; border: 3px solid #FFFFFF; cursor: pointer"></button>
<button type="button" aria-label="Tenue noire et or" style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #1A0B2E 50%, #FFC83D 50%); border: 3px solid #3A2A78; cursor: pointer"></button>
<button type="button" aria-label="Tenue holographique" style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2EE6FF, #B04BFF, #FF3EA5); border: 3px solid #3A2A78; cursor: pointer"></button>
</div>
</div>
<div style="padding: 14px; border-radius: 18px; background: #1E1450; border: 2px solid #3A2A78; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #B9B0E8">EFFET NÉON</span>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Aura rose" style="width: 44px; height: 44px; border-radius: 50%; background: #120B2E; border: 3px solid #FF3EA5; box-shadow: 0 0 14px #FF3EA5; cursor: pointer"></button>
<button type="button" aria-label="Aura cyan" style="width: 44px; height: 44px; border-radius: 50%; background: #120B2E; border: 3px solid #2EE6FF; box-shadow: 0 0 14px #2EE6FF; cursor: pointer"></button>
<button type="button" aria-label="Aura dorée" style="width: 44px; height: 44px; border-radius: 50%; background: #120B2E; border: 3px solid #FFC83D; box-shadow: 0 0 14px #FFC83D; cursor: pointer"></button>
</div>
</div>
<div style="padding: 14px; border-radius: 18px; background: #1E1450; border: 2px solid #3A2A78; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #B9B0E8">COMPAGNON</span>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Renard étoilé" style="width: 44px; height: 44px; border-radius: 12px; background: #2A1B6E; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l4 5h8l4-5-1 9a7 7 0 0 1-14 0z" fill="#FF8A3D"></path><path d="M8 14a4 3 0 0 0 8 0l-4 5z" fill="#FFFFFF"></path><circle cx="9.5" cy="12" r="1.2" fill="#1A0B2E"></circle><circle cx="14.5" cy="12" r="1.2" fill="#1A0B2E"></circle></svg></button>
<button type="button" aria-label="Petit tigre" style="width: 44px; height: 44px; border-radius: 12px; background: #2A1B6E; border: 3px solid #3A2A78; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#FFB020"></circle><circle cx="6" cy="6" r="3" fill="#FFB020"></circle><circle cx="18" cy="6" r="3" fill="#FFB020"></circle><path d="M12 5v4M8 6l1 3M16 6l-1 3" stroke="#1A0B2E" stroke-width="1.5"></path><circle cx="9" cy="13" r="1.2" fill="#1A0B2E"></circle><circle cx="15" cy="13" r="1.2" fill="#1A0B2E"></circle><path d="M10 16q2 2 4 0" stroke="#1A0B2E" stroke-width="1.3" fill="none"></path></svg></button>
<button type="button" aria-label="Robot pixel" style="width: 44px; height: 44px; border-radius: 12px; background: #2A1B6E; border: 3px solid #3A2A78; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="3" fill="#2EE6FF"></rect><rect x="11" y="3" width="2" height="4" fill="#2EE6FF"></rect><rect x="7" y="11" width="3" height="3" fill="#1A0B2E"></rect><rect x="14" y="11" width="3" height="3" fill="#1A0B2E"></rect><rect x="8" y="16" width="8" height="2" fill="#1A0B2E"></rect></svg></button>
</div>
</div>
</div>

<div style="flex: 1"></div>

<div style="display: flex; justify-content: center">
<button type="button" style="width: 360px; height: 66px; border: none; border-radius: 20px; background: #FF3EA5; color: #1A0B2E; font-family: 'Bungee', sans-serif; font-size: 24px; letter-spacing: 1px; box-shadow: 0 7px 0 #A61D68, 0 0 28px rgba(255, 62, 165, 0.6); cursor: pointer">C'EST MOI !</button>
</div>
</div>


</body>
</html>
