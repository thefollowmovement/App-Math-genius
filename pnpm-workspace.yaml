packages:
  - apps/*
  - packages/*
  - services/*

# Skia's postinstall copies its native libraries from the packages already installed (no download).
onlyBuiltDependencies:
  - '@shopify/react-native-skia'

# Postinstall only re-checks native bindings already installed through optionalDependencies.
ignoredBuiltDependencies:
  - '@swc/core'
  - unrs-resolver

# react-native-css (NativeWind v5) breaks on `var()` with lightningcss >= 1.30.2: keep the copy it resolves on 1.30.1.
# Tailwind keeps its own pinned lightningcss.
overrides:
  '@expo/metro-config>lightningcss': 1.30.1
